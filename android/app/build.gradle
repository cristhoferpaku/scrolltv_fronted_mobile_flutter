plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.scrolltv_frontend_mobile_flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.scrolltv_frontend_mobile_flutter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
    flavorDimensions = ["platform"]
    productFlavors {
        moviehomeMobile {
            dimension = "platform"
            applicationIdSuffix = ".mobile.moviehome"
            versionNameSuffix = "-mobile-moviehome"
            resValue "string", "app_name", "MovieHome App"
        }
        scrolltvMobile {
            dimension = "platform"
            applicationIdSuffix = ".mobile.scrolltv"
            versionNameSuffix = "-mobile-scrolltv"
            resValue "string", "app_name", "ScrollTV App"
        }
        moviehomeTv {
            dimension = "platform"
            applicationIdSuffix = ".tv.moviehome"
            versionNameSuffix = "-tv-moviehome"
            resValue "string", "app_name", "MovieHome Tv"
        }
        scrolltvTv {
            dimension = "platform"
            applicationIdSuffix = ".tv.scrolltv"
            versionNameSuffix = "-tv-scrolltv"
            resValue "string", "app_name", "ScrollTV Tv"
        }
    }
}

flutter {
    source = "../.."
}
