name: scrolltv_frontend_mobile_flutter
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  dio: ^5.8.0+1
  dio_cache_interceptor: ^3.4.4
  dio_cache_interceptor_hive_store: ^4.0.0
  envied: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.0
  freezed_annotation: ^3.0.0
  get_it: ^8.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.0
  lottie: ^3.3.1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  timezone: ^0.10.1

dev_dependencies:
  build_runner: ^2.4.13
  envied_generator: ^1.1.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space-grotesk/SpaceGrotesk-Bold.ttf
          weight: 900
        - asset: assets/fonts/space-grotesk/SpaceGrotesk-Medium.ttf
          weight: 700
        - asset: assets/fonts/space-grotesk/SpaceGrotesk-Regular.ttf
          weight: 500
        - asset: assets/fonts/space-grotesk/SpaceGrotesk-Light.ttf
          weight: 400
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 900
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 700
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 400
